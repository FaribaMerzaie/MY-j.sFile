    </section>
    <section class="container my-5">
        <div class="row align-items-center">
            <div class="col-md-6 fade-up">
                <img src="./img/photo_2026-05-06_23-44-30.jpg" class="img-fluid rounded img-box">
            </div>
            <div class="col-md-6 fade-up">
                <h2 class="text-center mb-4">Checkout</h2>
                <div class="row">
                    <!-- 🧾 FORM -->
                    <div class="col-md-6">
                        <form id="checkout-form">
                            <div class="mb-3">
                                <label>Name</label>
                                <input type="text" class="form-control" id="name">
                                <small class="text-danger error" id="name-error"></small>
                            </div>
                            <div class="mb-3">
                                <div class="mb-3">
                                    <label>Email</label>
                                    <input type="email" class="form-control" id="email">
                                    <small class="text-danger error" id="email-error"></small>
                                </div>
                                <div class="mb-3">
                                    <label>Phone</label>
                                    <input type="text" class="form-control" id="phone">
                                </div>
                                <div class="mb-3">
                                    <label>Address</label>
                                    <textarea class="form-control" id="address"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label>Payment Method</label>
                                    <select class="form-control" id="payment">
                                        <option value="">Select</option>
                                        <option>Cash</option>
                                        <option>Card</option>
                                    </select>
                                </div>
                                <button class="btn btn-success w-100">Place Order</button>
                        </form>
                    </div>
                    <!-- سفارش-->
                    <div class="col-md-6">
                        <h4>Your Order</h4>
                        <div id="order-items"></div>
                        <h5 class="mt-3" id="order-total"></h5>
                    </div>
                </div>
            </div>
